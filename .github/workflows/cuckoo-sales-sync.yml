name: CUCKOO Sales Sync

on:
  schedule:
    # Every 30 minutes; GitHub cron is UTC.
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: cuckoo-sales-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync all active staff
        run: node scripts/sync-cuckoo-sales.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CUCKOO_API_BASE_URL: ${{ secrets.CUCKOO_API_BASE_URL }}
          CUCKOO_API_APP_NAME: ${{ secrets.CUCKOO_API_APP_NAME }}
          CUCKOO_API_KEY: ${{ secrets.CUCKOO_API_KEY }}
